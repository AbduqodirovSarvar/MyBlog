<title>Ответ на ваш комментарий: {{postTitle}}</title>
<p>Здравствуйте, {{recipientName}}!</p>
<p><strong>{{commenterName}}</strong> ответил(а) на ваш комментарий к посту <strong>{{postTitle}}</strong>:</p>
<blockquote style="margin:16px 0;padding:12px 16px;border-left:4px solid #2563eb;background-color:#f3f4f6;color:#374151;white-space:pre-line;">{{commentExcerpt}}</blockquote>
<p><a href="{{link}}" style="display:inline-block;padding:10px 20px;background-color:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">Посмотреть ответ</a></p>
<p style="font-size:13px;color:#6b7280;">Такие уведомления можно отключить в настройках профиля.</p>
